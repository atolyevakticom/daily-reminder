name: Günlük Hesap Kontrol Hatırlatıcısı

on:
  schedule:
    # Türkiye saati UTC+3 sabit (yaz saati uygulaması yok) — 08:00 TR = 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # GitHub arayüzünden manuel olarak da çalıştırabilirsin

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Hatırlatma scriptini çalıştır
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_reminder.py
